[wallpaper]
width = 1920
height = 1080
theme = car
[theme car]
color = #EEECE5
update_seconds = 60
[element car.road]
kind = markers
count = 60
radius = 0.28
size = 0.004
color = #7B827C
[element car.hour]
kind = hand
source = hour
shape = triangle
length = 0.16
tail = 0.015
width = 0.014
[element car.car]
kind = orbit
source = minute
image = sprites/car.png
radius = 0.28
size = 0.075
rotate = true
heading_offset = 90
offset = 0
[element car.time]
kind = text
text = %H:%M
y = 0.85
size = 0.025
[rule 09:00]
text =
[rule 18:00]
color = #E8CBB5
text = Leave office
