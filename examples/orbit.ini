; A replaceable pointer: a dot (or transparent PNG car) on a 24-hour orbit.
[wallpaper]
width = 1080
height = 1920
theme = orbit
[theme orbit]
color = #EEECE5
update_seconds = 60
[element orbit.track]
kind = markers
count = 24
radius = 0.32
size = 0.006
[element orbit.sun]
kind = orbit
source = day
offset = 180
radius = 0.32
size = 0.07
color = #DC9950
; image = car.png
