; Export scheduled scenes for phone automations, with no misleading frozen hands.
[wallpaper]
width = 1080
height = 1920
theme = phone
[theme phone]
color = #EEECE5
update_seconds = 0
[element phone.markers]
kind = markers
count = 12
radius = 0.28
size = 0.009
color = #7B827C
[rule 06:00]
color = #F2EBDD
text = Good morning
[rule 09:00]
color = #EEECE5
text = Focus
[rule 18:00]
color = #E8CBB5
text = Leave office
[rule 20:00]
color = #ACB6B0
text = Slow down
[rule 23:00]
color = #8B979C
text = Good night
