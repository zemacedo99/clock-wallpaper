; Fixed local dawn/dusk: a design concept, not an astronomical ephemeris.
[wallpaper]
width = 1920
height = 1080
theme = sky
[theme sky]
color = #172032
update_seconds = 60
[element sky.markers]
kind = markers
radius = 0.28
size = 0.009
color = #98AABC
[element sky.sun]
kind = orbit
source = span
visible_from = 06:00
visible_until = 18:00
arc_start = 270
arc_end = 90
radius = 0.28
size = 0.05
color = #F6C343
[element sky.moon]
kind = orbit
shape = crescent
source = span
visible_from = 18:00
visible_until = 06:00
arc_start = 270
arc_end = 90
radius = 0.28
size = 0.05
color = #D8DBE6
[element sky.time]
kind = text
text = %H:%M
size = 0.04
color = #D8DBE6
