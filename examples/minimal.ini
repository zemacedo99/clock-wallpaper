; UTF-8 INI. Paths are relative to this file. No quotes or inline comments.
[wallpaper]
width = 1920
height = 1080
theme = minimal

[theme minimal]
color = #EEECE5
update_seconds = 60
text_color = #565C58
; background = photographs/desk.jpg

[element minimal.markers]
kind = markers
count = 12
radius = 0.28
size = 0.009
color = #7B827C

[element minimal.hour]
kind = hand
source = hour
length = 0.16
width = 0.009
color = #343C37

[element minimal.minute]
kind = hand
source = minute
length = 0.235
width = 0.004
color = #343C37

[element minimal.hub]
kind = orbit
radius = 0
size = 0.018
color = #BE775B

[rule 06:00]
color = #F2EBDD
text = Good morning

[rule 09:00]
color = #EEECE5
text =

[rule 18:00]
color = #E8CBB5
text = Leave office
; background = leave-office.jpg

[rule 20:00]
color = #ACB6B0
text = Slow down

[rule 23:00]
color = #8B979C
text = Good night
